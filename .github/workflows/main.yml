name: Egypt Deals Hunter SMART v4

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      telegram_only:
        description: 'Test Telegram only (do not scan stores)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: egypt-deals-smart-main
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Scan observed prices and make automatic decisions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DB_FILE: egypt_deals.db
          AMAZON_PER_RUN: '5'
          AMAZON_PAGES_PER_CATEGORY: '2'
          AUTO_WATCH_PER_RUN: '10'
          NOON_PER_RUN: '0'
          ENABLE_NOON_HTML: '0'
          MAX_WORKERS: '3'
          PRODUCT_CONFIRMATION: '1'
        run: |
          if [ "${{ inputs.telegram_only }}" = "true" ]; then
            python -u hunter.py --test-telegram
          else
            python -u hunter.py --once
          fi

      - name: Save observations (even if scanning had errors)
        if: always()
        run: |
          git config user.name 'Deals Hunter Bot'
          git config user.email 'bot@github.com'
          git add -- egypt_deals.db
          if ! git diff --cached --quiet; then
            git commit -m 'Save automatic deal observations [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No price changes.'
          fi
